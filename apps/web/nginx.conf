# Per-client concurrency for raw blob downloads (#157). This file is included
# from nginx's http{} block (it is installed as conf.d/default.conf), which is
# where a shared-memory zone has to be declared.
#
# This lives here, and not in the API, because this is the only layer that knows
# who is asking: nginx is the edge and sees the real client address, while the
# API sees the proxy's address as the peer for every request (Fastify is built
# without trustProxy). A cap applied in the API would therefore be global, and a
# global cap on a route with no size ceiling is a denial-of-service amplifier —
# a handful of sockets that take the headers and never read would deny raw blobs
# to everyone. Per-client, one client's downloads only ever bound that client.
limit_conn_zone $binary_remote_addr zone=rawblob_per_client:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # git-over-HTTP: needs raw streaming request bodies (pack data), not buffered.
    location /git/ {
        proxy_pass http://api:3001;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        client_max_body_size 0;
    }

    # Raw blob bytes: the API streams these with no size ceiling (#157), so the
    # proxy must stream them too. nginx buffers responses by default — it would
    # read the whole blob into proxy_buffers and then spool the rest to a temp
    # file (up to proxy_max_temp_file_size, 1 GiB by default) on this container's
    # writable layer before any backpressure reached the API. That turns "peak
    # memory is one relay buffer" into "up to a gigabyte of container disk per
    # in-flight download", and it is disk nothing here reclaims promptly.
    # proxy_buffering off makes nginx a pass-through: it writes to the client as
    # fast as the client reads, and a slow client blocks git, which is the whole
    # design. Must precede the general API location — regex locations match in
    # order of definition.
    location ~ ^/repos/[^/]+/[^/]+/rawblob$ {
        proxy_pass http://api:3001;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;

        # A multi-gigabyte download over a slow link is the expected case here,
        # not an anomaly, so the timeout that governs writing the RESPONSE BODY
        # to the client is the one that matters — and that is `send_timeout`,
        # not `proxy_send_timeout` (which governs writing the *request* to the
        # upstream, and for a bodyless GET never comes into play at all). An
        # earlier revision raised only the latter and left the response side on
        # nginx's 60 s default.
        #
        # `send_timeout` is an idle timer between two successive writes to the
        # client and is reset by partial progress, so a client that keeps reading
        # — however slowly — keeps resetting it. It is raised anyway, because a
        # timeout on this route must never be reachable by a transfer that is
        # still moving.
        send_timeout 1h;
        # Reading the response from the API. With proxy_buffering off nginx stops
        # reading while the client is blocked, and the upstream socket then has
        # data pending, so this timer is only live when *git* has gone quiet.
        proxy_read_timeout 1h;

        # The only cap on this route. It counts a client's simultaneous raw-blob
        # downloads, and it is neither a size limit nor a deadline: it never
        # interrupts a transfer that has started, and a blob of any size occupies
        # exactly one of these. Generous on purpose — a browser opens at most ~6
        # connections per host, so this is aimed at a client with hundreds.
        limit_conn rawblob_per_client 32;
        limit_conn_status 503;
    }

    # Everything else the API owns (see apps/api/src/server.ts route registrations).
    location ~ ^/(health|auth|repos|users|notifications|search)(/|$) {
        proxy_pass http://api:3001;
    }

    # SPA — everything else falls through to index.html (react-router handles routing).
    location / {
        try_files $uri /index.html;
    }
}
