# ForgeHub — PostgreSQL deployment.
#
# Standalone: does NOT need docker-compose.yml.
#
# Quick start:
#   cp .env.postgres.example .env.postgres
#   # Edit .env.postgres — set JWT_SECRET and POSTGRES_PASSWORD
#   docker compose -f docker-compose.postgres.yml --env-file .env.postgres up -d --build
#   podman compose -f docker-compose.postgres.yml --env-file .env.postgres up -d --build
#
# On first boot Prisma runs `db push` to create the schema with PostgreSQL DDL.
# Subsequent boots are idempotent (additive schema changes only).
#
# Git repos + CI data live on forgehub-data / forgehub-ci (same names as the
# SQLite compose file so repos survive a provider switch).
# PostgreSQL data lives on the separate forgehub-pgdata volume.
#
# Compose file format 2.4 — works with docker-compose v1, docker compose v2,
# podman-compose, and podman compose; the only schema with both top-level
# named volumes AND depends_on: condition: service_healthy.

version: "2.4"

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: forgehub
      POSTGRES_USER: forgehub
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.postgres — see .env.postgres.example}"
    volumes:
      - forgehub-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgehub -d forgehub"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  forgehub:
    build:
      context: .
      args:
        DATABASE_PROVIDER: postgresql
        DATABASE_URL_BUILD: "postgresql://user:pass@localhost:5432/forgehub"
    environment:
      DATABASE_URL: "postgresql://forgehub:${POSTGRES_PASSWORD}@postgres:5432/forgehub"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env.postgres — see .env.postgres.example}"
      PORT: "3001"
      GIT_STORAGE_ROOT: "/data/git-storage"
      FORGEHUB_CI_ROOT: "/ci"
      FORGEHUB_CI: "${FORGEHUB_CI:-}"
      FORGEHUB_SSH_PORT: "${FORGEHUB_SSH_PORT:-}"
      FORGEHUB_SSH_HOST: "${FORGEHUB_SSH_HOST:-}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      SMTP_URL: "${SMTP_URL:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      UNSUBSCRIBE_SECRET: "${UNSUBSCRIBE_SECRET:-}"
      CI_JOB_TIMEOUT: "${CI_JOB_TIMEOUT:-}"
      CI_MAX_LOG_BYTES: "${CI_MAX_LOG_BYTES:-}"
      AVATAR_MAX_BYTES: "${AVATAR_MAX_BYTES:-}"
      FORGEHUB_RAWBLOB_MAX_BYTES: "${FORGEHUB_RAWBLOB_MAX_BYTES:-}"
    ports:
      - "${WEB_PORT:-8080}:80"
    # SSH git transport: uncomment when FORGEHUB_SSH_PORT is set.
    # ports:
    #   - "${FORGEHUB_SSH_PORT:-2222}:${FORGEHUB_SSH_PORT:-2222}"
    volumes:
      - forgehub-data:/data
      - forgehub-ci:/ci
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  forgehub-pgdata:
  forgehub-data:
  forgehub-ci:
