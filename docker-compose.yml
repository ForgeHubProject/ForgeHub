services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: "file:/data/forgehub.db"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}"
      PORT: "3001"
      GIT_STORAGE_ROOT: "/data/git-storage"
      # CI logs and job workspaces live on their OWN volume (issue #86). Without
      # this they default to "<GIT_STORAGE_ROOT>-ci", i.e. /data/git-storage-ci —
      # the same volume as the SQLite database and every bare repo. A CI job is
      # repo-author-controlled code, so that placement put a job's throwaway
      # workspace directly beside the database file.
      #
      # UPGRADING an install that ran without this: whatever is already under
      # /data/git-storage-ci stays there and is no longer pruned by retention. The
      # boot sweep still clears leftover workspaces there; old logs are yours to
      # delete (see README, "Upgrading an existing install").
      FORGEHUB_CI_ROOT: "/ci"
      # Optional features — forwarded from the host .env file.
      # CI runner (off by default — see .env.example security note before enabling):
      FORGEHUB_CI: "${FORGEHUB_CI:-}"
      # SSH git transport (issue #116). Set FORGEHUB_SSH_PORT in .env to enable;
      # also uncomment the `ports` block below so the port is reachable on the host.
      # SSH is TCP — it cannot go through the nginx web container and must be
      # exposed directly from the api container.
      FORGEHUB_SSH_PORT: "${FORGEHUB_SSH_PORT:-}"
      # Explicit hostname used in the SSH clone URL shown in the web UI.
      # When unset the browser's hostname is used (correct for most deployments).
      FORGEHUB_SSH_HOST: "${FORGEHUB_SSH_HOST:-}"
    # SSH git transport: uncomment when FORGEHUB_SSH_PORT is set in .env.
    # SSH is TCP — nginx cannot proxy it, so this port must be exposed here on
    # the api service directly, not via the web service. The host port and the
    # container port are the same; to map port 22 externally, use a host
    # firewall rule or load-balancer redirect rather than changing this line.
    # ports:
    #   - "${FORGEHUB_SSH_PORT:-2222}:${FORGEHUB_SSH_PORT:-2222}"
    volumes:
      # forgehub-data: the durable forge — SQLite DB + bare repos. Losing it loses
      #                the instance.
      # forgehub-ci:   CI logs and workspaces. Entirely reconstructible; safe to
      #                delete wholesale.
      #
      # BE PRECISE ABOUT WHAT THIS SPLIT BUYS: separate lifecycles, a workspace that
      # is not in the same tree as the database, and a mount point you can put a
      # quota on. It does NOT by itself stop a runaway job from filling the disk the
      # database sits on — by default both named volumes live on the SAME host
      # filesystem (/var/lib/docker/volumes). If that matters to you, back
      # forgehub-ci with its own device or an fs-level quota. The actual bound on
      # log growth is CI_MAX_LOG_BYTES, not this split.
      - forgehub-data:/data
      - forgehub-ci:/ci
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  forgehub-data:
  forgehub-ci:
