# ForgeHub — forgehubcode.com prod deploy (PostgreSQL, Rocky Linux 10 + podman-compose).
#
# Standalone: does NOT need repo-root docker-compose.yml or docker-compose.postgres.yml.
# Sits behind Nginx Proxy Manager on the host — NPM terminates TLS and proxies
# to 127.0.0.1:${WEB_PORT}, so no caddy/nginx/certbot service is defined here.
#
# Deploy:
#   scp -r deploy/ user@vps:/opt/forgehub/
#   ssh user@vps
#   cd /opt/forgehub/deploy
#   podman-compose up -d
#   # or: podman compose up -d
#
# In NPM: add a proxy host for forgehubcode.com -> 127.0.0.1:${WEB_PORT} (default 8080),
# with "Websockets Support" on, and request a Let's Encrypt cert for the domain.
#
# On first boot Prisma runs `db push` to create the schema with PostgreSQL DDL.
# Subsequent boots are idempotent (additive schema changes only).
#
# Compose file format 2.4 — the only schema podman-compose parses that supports
# both top-level named volumes AND depends_on: condition: service_healthy.
version: "2.4"

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: forgehub
      POSTGRES_USER: forgehub
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - forgehub-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgehub -d forgehub"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  forgehub:
    image: docker.io/touficmajdalani/forgehub:latest-postgres
    # Also published to ghcr.io/forgehubproject/forgehub:latest-postgres and quay.io/forgehubproject/forgehub:latest-postgres.
    environment:
      DATABASE_URL: "postgresql://forgehub:${POSTGRES_PASSWORD}@postgres:5432/forgehub"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      PORT: "3001"
      GIT_STORAGE_ROOT: "/data/git-storage"
      FORGEHUB_CI_ROOT: "/ci"
      FORGEHUB_CI: "${FORGEHUB_CI:-}"
      FORGEHUB_SSH_PORT: "${FORGEHUB_SSH_PORT:-}"
      FORGEHUB_SSH_HOST: "${FORGEHUB_SSH_HOST:-}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      SMTP_URL: "${SMTP_URL:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      UNSUBSCRIBE_SECRET: "${UNSUBSCRIBE_SECRET:-}"
      CI_JOB_TIMEOUT: "${CI_JOB_TIMEOUT:-}"
      CI_MAX_LOG_BYTES: "${CI_MAX_LOG_BYTES:-}"
      AVATAR_MAX_BYTES: "${AVATAR_MAX_BYTES:-}"
      FORGEHUB_RAWBLOB_MAX_BYTES: "${FORGEHUB_RAWBLOB_MAX_BYTES:-}"
    ports:
      # Bound to loopback only — NPM (on the same host) proxies in from the internet.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
      # SSH git transport — only published when FORGEHUB_SSH_PORT is set in .env.
      # NPM cannot proxy raw TCP; punch this through the VPS firewall directly
      # (NOT via NPM) if you enable it.
      # - "${FORGEHUB_SSH_PORT:-2222}:${FORGEHUB_SSH_PORT:-2222}"
    volumes:
      - forgehub-data:/data
      - forgehub-ci:/ci
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  forgehub-pgdata:
  forgehub-data:
  forgehub-ci:
