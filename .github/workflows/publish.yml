name: Publish container image

# Triggers:
#   push to main  → builds latest + sha-tagged image
#   tag v*.*.*    → builds semver-tagged image + updates latest
#
# Single image supports SQLite, PostgreSQL, and MySQL — the entrypoint detects
# the provider from DATABASE_URL at startup and patches Prisma accordingly.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # required to push to ghcr.io

jobs:
  publish:
    name: Build and push forgehub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets buildx cross-compile arm64 images on amd64 runners.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── registry logins ──────────────────────────────────────────────────────
      # ghcr.io — always available via GITHUB_TOKEN.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub — enabled when DOCKERHUB_USERNAME repo var is set.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # quay.io — enabled when QUAY_USERNAME repo var is set.
      - name: Log in to quay.io
        if: ${{ vars.QUAY_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # ── image list ───────────────────────────────────────────────────────────
      # ghcr.io always; Docker Hub and quay.io conditional on credentials.
      - name: Compute image list
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          QUAY_USERNAME: ${{ vars.QUAY_USERNAME }}
          OWNER: ${{ github.repository_owner }}
        run: |
          LIST="ghcr.io/${OWNER,,}/forgehub"
          if [[ -n "$DOCKERHUB_USERNAME" ]]; then
            LIST="${LIST}"$'\n'"docker.io/${DOCKERHUB_USERNAME}/forgehub"
          fi
          if [[ -n "$QUAY_USERNAME" ]]; then
            LIST="${LIST}"$'\n'"quay.io/${QUAY_USERNAME}/forgehub"
          fi
          printf 'list<<EOF\n%s\nEOF\n' "$LIST" >> "$GITHUB_OUTPUT"

      # ── OCI metadata ─────────────────────────────────────────────────────────
      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # ── build + push ─────────────────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "${{ steps.meta.outputs.tags }}" | head -1
