# nginx config for the combined ForgeHub image.
# Identical to apps/web/nginx.conf except proxy_pass targets
# 127.0.0.1:3001 (loopback to the API running in the same container)
# instead of http://api:3001 (the separate-container hostname).
limit_conn_zone $binary_remote_addr zone=rawblob_per_client:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # git-over-HTTP: needs raw streaming request bodies (pack data), not buffered.
    location /git/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        client_max_body_size 0;
    }

    # Raw blob bytes: stream without buffering — see apps/web/nginx.conf for
    # the full explanation of why proxy_buffering off is required here.
    location ~ ^/repos/[^/]+/[^/]+/rawblob$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        send_timeout 1h;
        proxy_read_timeout 1h;
        limit_conn rawblob_per_client 32;
        limit_conn_status 503;
    }

    # Everything else the API owns.
    location ~ ^/(health|auth|repos|users|notifications|search|server|user|orgs|git)(/|$) {
        proxy_pass http://127.0.0.1:3001;
    }

    # SPA — react-router handles routing.
    location / {
        try_files $uri /index.html;
    }
}
