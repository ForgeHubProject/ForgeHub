# nginx config for the combined ForgeHub image.
# Identical to apps/web/nginx.conf except proxy_pass targets
# 127.0.0.1:3001 (loopback to the API running in the same container)
# instead of http://api:3001 (the separate-container hostname).
limit_conn_zone $binary_remote_addr zone=rawblob_per_client:10m;

# A browser opening a page asks for HTML first; the app's own fetches don't.
map $http_accept $wants_page {
    default        0;
    "~^text/html"  1;
}

# Link previews (Slack, Discord, LinkedIn, X, iMessage, …) read a shared link's
# page without running the app, so they get the page's card instead: its title,
# description and image (#256). Only for a profile, a repository and anything in
# it, and the home page; files (an icon, /assets/) stay files. Search crawlers
# aren't on the list: they run the app.
map $http_user_agent $link_preview_agent {
    default 0;
    "~*(facebookexternalhit|facebot|twitterbot|slackbot|discordbot|linkedinbot|whatsapp|telegrambot|skypeuripreview|microsoftpreview|redditbot|mastodon|pleroma|cardyb|embedly|iframely|vkshare|pinterest|zulipurlpreview)" 1;
}
map "$link_preview_agent:$uri" $link_preview {
    default                0;
    "~^1:/assets/"         0;
    "~^1:/$"               1;
    "~^1:/[^/.]+/?$"       1;
    "~^1:/[^/]+/[^/]+"     1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # git-over-HTTP: needs raw streaming request bodies (pack data), not buffered.
    # ^~ so this prefix block wins over any regex location below (regex matches
    # take precedence over plain prefixes, which would reinstate the 1m default
    # client_max_body_size and 413 pushes).
    location ^~ /git/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        client_max_body_size 0;
    }

    # Raw blob bytes: stream without buffering — see apps/web/nginx.conf for
    # the full explanation of why proxy_buffering off is required here.
    location ~ ^/repos/[^/]+/[^/]+/rawblob$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        send_timeout 1h;
        proxy_read_timeout 1h;
        limit_conn rawblob_per_client 32;
        limit_conn_status 503;
    }

    # Paths that are both a page and an API endpoint. Opening one in the browser
    # (a link, a refresh) asks for HTML and gets the app; the app's fetches get
    # the API.
    location ~ ^/(notifications(/watching|/subscriptions)?|search|feed|explore|orgs/[^/]+/settings)$ {
        if ($wants_page) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:3001;
    }

    # Everything else the API owns.
    location ~ ^/(health|auth|repos|users|user|orgs|notifications|search|feed|explore|convert|fhr|handlers|renderers|server)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        # The API sets its own upload limits (commits from the web 50 MB, release
        # assets RELEASE_ASSET_MAX_BYTES, avatars AVATAR_MAX_BYTES); nginx's 1 MB
        # default would refuse those uploads before the API sees them.
        client_max_body_size 0;
        # Forks, merges and diffs of large models can take longer than a minute.
        proxy_read_timeout 300s;
    }

    # A link preview's card, rendered by the API (see $link_preview above).
    location ^~ /_preview/ {
        internal;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
    }

    # SPA — react-router handles routing.
    location / {
        if ($link_preview) {
            rewrite ^ /_preview$uri last;
        }
        try_files $uri /index.html;
    }
}
