# ForgeHub — MySQL deployment.
#
# Standalone: does NOT need docker-compose.yml.
#
# Quick start:
#   cp .env.mysql.example .env.mysql
#   # Edit .env.mysql — set JWT_SECRET, MYSQL_PASSWORD, and MYSQL_ROOT_PASSWORD
#   docker compose -f docker-compose.mysql.yml --env-file .env.mysql up -d --build
#   podman compose -f docker-compose.mysql.yml --env-file .env.mysql up -d --build
#
# On first boot Prisma runs `db push` to create the schema with MySQL DDL.
# Subsequent boots are idempotent (additive schema changes only).
#
# Git repos + CI data live on forgehub-data / forgehub-ci (same names as the
# SQLite compose file so repos survive a provider switch).
# MySQL data lives on the separate forgehub-mysqldata volume.
#
# Compose file format 2.4 — works with docker-compose v1, docker compose v2,
# podman-compose, and podman compose; the only schema with both top-level
# named volumes AND depends_on: condition: service_healthy.

version: "2.4"

services:
  mysql:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: forgehub
      MYSQL_USER: forgehub
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.mysql — see .env.mysql.example}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.mysql — see .env.mysql.example}"
    volumes:
      - forgehub-mysqldata:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      # `mysqladmin ping --silent` checks that mysqld accepts connections; no
      # credentials needed for this particular check.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 45s

  forgehub:
    build: .
    environment:
      DATABASE_URL: "mysql://forgehub:${MYSQL_PASSWORD}@mysql:3306/forgehub"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env.mysql — see .env.mysql.example}"
      PORT: "3001"
      GIT_STORAGE_ROOT: "/data/git-storage"
      FORGEHUB_CI_ROOT: "/ci"
      FORGEHUB_CI: "${FORGEHUB_CI:-}"
      FORGEHUB_SSH_PORT: "${FORGEHUB_SSH_PORT:-}"
      FORGEHUB_SSH_HOST: "${FORGEHUB_SSH_HOST:-}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      SMTP_URL: "${SMTP_URL:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      UNSUBSCRIBE_SECRET: "${UNSUBSCRIBE_SECRET:-}"
      CI_JOB_TIMEOUT: "${CI_JOB_TIMEOUT:-}"
      CI_MAX_LOG_BYTES: "${CI_MAX_LOG_BYTES:-}"
      AVATAR_MAX_BYTES: "${AVATAR_MAX_BYTES:-}"
      FORGEHUB_RAWBLOB_MAX_BYTES: "${FORGEHUB_RAWBLOB_MAX_BYTES:-}"
    ports:
      - "${WEB_PORT:-8080}:80"
    # SSH git transport: uncomment when FORGEHUB_SSH_PORT is set.
    # ports:
    #   - "${FORGEHUB_SSH_PORT:-2222}:${FORGEHUB_SSH_PORT:-2222}"
    volumes:
      - forgehub-data:/data
      - forgehub-ci:/ci
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  forgehub-mysqldata:
  forgehub-data:
  forgehub-ci:
